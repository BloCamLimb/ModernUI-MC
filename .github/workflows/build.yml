# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [ pull_request, push ]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [ 25 ]
        distro: [ temurin ]
        # and run on Linux
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distro }}
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      # The installable artifact of each loader is its *-universal.jar; the root
      # project builds no jar of its own. With archive: false the upload is not
      # zipped, and the artifact name becomes the downloaded file name, so each
      # one is named after the jar it carries.
      - name: locate universal jars
        id: jars
        run: |
          set -euo pipefail
          shopt -s nullglob
          for loader in fabric forge neoforge; do
            jars=("$loader"/build/libs/*-universal.jar)
            if [ ${#jars[@]} -ne 1 ]; then
              echo "::error::expected one universal jar in $loader/build/libs, found ${#jars[@]}"
              exit 1
            fi
            echo "${loader}_path=${jars[0]}" >> "$GITHUB_OUTPUT"
            echo "${loader}_name=$(basename "${jars[0]}")" >> "$GITHUB_OUTPUT"
          done

      - name: capture Fabric artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.jars.outputs.fabric_name }}
          path: ${{ steps.jars.outputs.fabric_path }}
          archive: false
          if-no-files-found: error

      - name: capture Forge artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.jars.outputs.forge_name }}
          path: ${{ steps.jars.outputs.forge_path }}
          archive: false
          if-no-files-found: error

      - name: capture NeoForge artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.jars.outputs.neoforge_name }}
          path: ${{ steps.jars.outputs.neoforge_path }}
          archive: false
          if-no-files-found: error